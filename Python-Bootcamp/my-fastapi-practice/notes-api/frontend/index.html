<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Notes</h1>
    <button id="btn-open-create" class="btn btn-primary" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>New Note</span>
    </button>
  </header>

  <main class="app-main">
    <ul id="notes-list" class="notes-list" role="list" aria-label="Notes"></ul>
    <div id="empty-state" class="empty-state hidden">
      <p>No notes yet. Create your first note to get started.</p>
    </div>
  </main>

  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Create Note</h2>
        <button id="btn-close-modal" class="btn-icon" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="note-form" class="note-form" novalidate>
        <input type="hidden" id="note-id" />
        <div class="form-group">
          <label for="note-title-input" class="form-label">Title</label>
          <input
            id="note-title-input"
            class="form-input"
            type="text"
            placeholder="Enter note title"
            required
            minlength="1"
            maxlength="100"
            autocomplete="off"
          />
        </div>
        <div class="form-group">
          <label for="note-body-input" class="form-label">Body</label>
          <textarea
            id="note-body-input"
            class="form-textarea"
            placeholder="Write your note here..."
            required
            minlength="5"
            maxlength="300"
            rows="6"
          ></textarea>
        </div>
        <div class="form-actions">
          <button id="btn-cancel" class="btn btn-secondary" type="button">Cancel</button>
          <button id="btn-save" class="btn btn-primary" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
